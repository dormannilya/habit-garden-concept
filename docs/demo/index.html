<!doctype html>
<html lang="en">

<head>
  <script>
    (function () {
      const RO = window.ResizeObserver;
      if (RO) {
        window.ResizeObserver = class extends RO {
          constructor(cb) {
            super((entries, obs) => {
              window.requestAnimationFrame(() => {
                try { cb(entries, obs); } catch (e) { }
              });
            });
          }
        };
      }
      window.addEventListener('error', function (e) {
        if (e && e.message && e.message.indexOf('ResizeObserver') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }
      }, true);
    })();
  </script>
  <meta charset="utf-8" />
  <title>Habit Garden Demo Concept</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #1a1814;
      font-family: 'Manrope', -apple-system, system-ui, sans-serif;
      min-height: 100vh;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      box-sizing: border-box;
      background: radial-gradient(ellipse 60% 50% at 50% 30%, #2a2a22 0%, #16140f 70%);
    }

    @keyframes firefly {

      0%,
      100% {
        opacity: 0;
        transform: translate(0, 0) scale(0.6);
      }

      40% {
        opacity: 0.95;
        transform: translate(8px, -6px) scale(1);
      }

      70% {
        opacity: 0.7;
        transform: translate(-4px, -2px) scale(0.9);
      }
    }

    @keyframes drop {
      0% {
        transform: translateY(0) scaleY(0.6);
        opacity: 0;
      }

      30% {
        opacity: 1;
      }

      100% {
        transform: translateY(30px) scaleY(1.2);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes sheetUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    @keyframes tabIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
        filter: blur(2px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes leafDrift {
      0% {
        transform: translate(-20px, -20px) rotate(0);
        opacity: 0;
      }

      20% {
        opacity: 0.6;
      }

      80% {
        opacity: 0.6;
      }

      100% {
        transform: translate(420px, 880px) rotate(540deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;

    function IOSStatusBar() {

    function IOSDevice({ children, width = 402, height = 874 }) {
      return (
        <div style={{
          width, height, borderRadius: 48, overflow: 'hidden',
          position: 'relative', background: '#000',
          boxShadow: '0 40px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.4)',
          fontFamily: '-apple-system, system-ui, sans-serif',
          WebkitFontSmoothing: 'antialiased',
        }}>
          <div style={{
            position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
            width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
          }} />
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
            <IOSStatusBar />
          </div>
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
            <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>{children}</div>
          </div>
          <div style={{
            position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,

          }}>

      );
    }

    const P = {
      bgTop: '#0a1612', bgMid: '#0e1d18', bgBot: '#16201a',
      moon: '#f0d9a8', amber: '#d4a25e', amberWarm: '#e8b87a',
      cream: '#f0e8d5', creamMuted: '#bdb5a3', muted: '#8a9389',
      leaf: '#7eb586', leafBright: '#a8d39e', leafDeep: '#3d6647',
      soil: '#2a1f15', soilLight: '#3d2d1f',
      hillFar: '#152822', hillMid: '#172f24', hillNear: '#1b3a2a',
    };

    const PLANT_COLORS = {
      leafLight: '#a8d39e', leaf: '#7eb586', leafDeep: '#4a7d5a', leafShadow: '#2d4f38',
      stem: '#6a9568', stemDark: '#3d5e3f',
      bloom: '#e8b87a', bloomDeep: '#d49457', bloomPink: '#e8a5a0',
      wilt: '#8a7a4a', wiltDeep: '#5e5230',
      pot: '#2a1f15', potRim: '#3d2d1f', soil: '#1a120a',
    };

    function SoilPatch({ cx, cy, w = 66 }) {
      const c = PLANT_COLORS;
      const rx = w / 2;
      const ry = Math.max(4.5, rx * 0.22);
      return (
        <g>
          <ellipse cx={cx} cy={cy + ry * 0.55} rx={rx * 0.95} ry={ry * 0.6} fill="#070504" opacity="0.45" />
          <ellipse cx={cx} cy={cy} rx={rx} ry={ry} fill={c.soil} />
          <ellipse cx={cx} cy={cy - ry * 0.32} rx={rx * 0.88} ry={ry * 0.56} fill={c.potRim} />
          <ellipse cx={cx - rx * 0.42} cy={cy - ry * 0.18} rx={Math.min(3.0, rx * 0.075)} ry={0.9} fill={c.soil} opacity="0.55" />
          <ellipse cx={cx + rx * 0.46} cy={cy + ry * 0.05} rx={Math.min(2.2, rx * 0.06)} ry={0.7} fill={c.soil} opacity="0.45" />
        </g>
      );
    }

    function Plant({ species = 'leafy', stage = 2, wilted = false, size = 120 }) {
      const c = { ...PLANT_COLORS };
      if (wilted) {
        c.leafLight = c.wilt; c.leaf = c.wilt; c.leafDeep = c.wiltDeep; c.leafShadow = c.wiltDeep;
        c.stem = c.wiltDeep; c.stemDark = c.wiltDeep;
        c.bloom = c.wilt; c.bloomDeep = c.wiltDeep; c.bloomPink = c.wilt;
      }
      const W = 120, H = 140, GY = 130;

      const renderLotus = () => {
        if (stage === 0) return <ellipse cx={W / 2} cy={GY - 4} rx={5} ry={3} fill={c.bloomDeep} />;
        if (stage === 1) return (
          <g transform={wilted ? `translate(0,4) rotate(-12 ${W / 2} ${GY})` : ''}>
            <path d={`M${W / 2} ${GY} Q ${W / 2 - 2} ${GY - 15}, ${W / 2 + 1} ${GY - 22}`} stroke={c.stem} strokeWidth="2.5" fill="none" strokeLinecap="round" />
            <ellipse cx={W / 2 - 5} cy={GY - 20} rx={6} ry={3} fill={c.leaf} transform={`rotate(-30 ${W / 2 - 5} ${GY - 20})`} />
            <ellipse cx={W / 2 + 6} cy={GY - 18} rx={6} ry={3} fill={c.leafLight} transform={`rotate(30 ${W / 2 + 6} ${GY - 18})`} />
          </g>
        );
        const top = stage === 4 ? GY - 78 : stage === 3 ? GY - 65 : GY - 45;
        return (
          <g transform={wilted ? `rotate(-15 ${W / 2} ${GY})` : ''}>
            <path d={`M${W / 2} ${GY} Q ${W / 2 - 4} ${GY - 30}, ${W / 2 + 2} ${top}`} stroke={c.stem} strokeWidth="3" fill="none" strokeLinecap="round" />
            <ellipse cx={W / 2 - 14} cy={GY - 20} rx={11} ry={5} fill={c.leafDeep} transform={`rotate(-30 ${W / 2 - 14} ${GY - 20})`} />
            <ellipse cx={W / 2 + 14} cy={GY - 28} rx={11} ry={5} fill={c.leaf} transform={`rotate(30 ${W / 2 + 14} ${GY - 28})`} />
            {stage >= 3 && (
              <React.Fragment>
                <ellipse cx={W / 2 - 13} cy={GY - 45} rx={10} ry={4.5} fill={c.leaf} transform={`rotate(-35 ${W / 2 - 13} ${GY - 45})`} />
                <ellipse cx={W / 2 + 13} cy={GY - 55} rx={10} ry={4.5} fill={c.leafLight} transform={`rotate(35 ${W / 2 + 13} ${GY - 55})`} />
              </React.Fragment>
            )}
            {stage === 4 && (
              <g transform={`translate(${W / 2 + 2}, ${top - 4})`}>
                <ellipse cx="-7" cy="0" rx="6" ry="3" fill={c.bloomPink} transform="rotate(-30)" />
                <ellipse cx="7" cy="0" rx="6" ry="3" fill={c.bloomPink} transform="rotate(30)" />
                <ellipse cx="0" cy="-6" rx="5" ry="3" fill={c.bloom} />
                <ellipse cx="0" cy="4" rx="5" ry="2.5" fill={c.bloomDeep} />
                <circle cx="0" cy="-1" r="2.5" fill={c.bloomDeep} />
                <circle cx="0" cy="-1" r="1.2" fill={c.bloom} />
              </g>
            )}
          </g>
        );
      };

      const renderLeafy = () => {
        if (stage === 0) return <ellipse cx={W / 2} cy={GY - 3} rx={5} ry={2.5} fill={c.leafShadow} />;
        const baseLeaf = (cx, cy, rx, ry, rot, fill, key) => (
          <ellipse key={key} cx={cx} cy={cy} rx={rx} ry={ry} fill={fill} transform={`rotate(${rot} ${cx} ${cy})`} />
        );
        if (stage === 1) return (
          <g transform={wilted ? `rotate(-15 ${W / 2} ${GY})` : ''}>
            <path d={`M${W / 2} ${GY} L ${W / 2} ${GY - 8}`} stroke={c.stemDark} strokeWidth="2" strokeLinecap="round" />
            {baseLeaf(W / 2 - 4, GY - 10, 7, 4, -25, c.leaf, 'l1')}
            {baseLeaf(W / 2 + 5, GY - 12, 7, 4, 25, c.leafLight, 'l2')}
          </g>
        );
        return (
          <g transform={wilted ? `rotate(-12 ${W / 2} ${GY + 5}) translate(0, 6)` : ''}>
            <path d={`M${W / 2} ${GY} L ${W / 2} ${GY - 18}`} stroke={c.stemDark} strokeWidth="3" strokeLinecap="round" />
            {baseLeaf(W / 2 - 15, GY - 10, 12, 6, -48, c.leafDeep, 'b1')}
            {baseLeaf(W / 2 + 15, GY - 10, 12, 6, 48, c.leafDeep, 'b2')}
            {baseLeaf(W / 2, GY - 16, 8, 11, 0, c.leafDeep, 'b3')}
            {stage >= 2 && (
              <React.Fragment>
                {baseLeaf(W / 2 - 13, GY - 22, 11, 5.5, -30, c.leaf, 'm1')}
                {baseLeaf(W / 2 + 13, GY - 22, 11, 5.5, 30, c.leaf, 'm2')}
                {baseLeaf(W / 2 - 4, GY - 28, 7, 11, -10, c.leaf, 'm3')}
                {baseLeaf(W / 2 + 4, GY - 28, 7, 11, 10, c.leaf, 'm4')}
              </React.Fragment>
            )}
            {stage >= 3 && (
              <React.Fragment>
                {baseLeaf(W / 2 - 8, GY - 38, 8, 5, -25, c.leafLight, 't1')}
                {baseLeaf(W / 2 + 8, GY - 38, 8, 5, 25, c.leafLight, 't2')}
                {baseLeaf(W / 2, GY - 44, 6, 9, 0, c.leafLight, 't3')}
              </React.Fragment>
            )}
            {stage === 4 && (
              <React.Fragment>
                <circle cx={W / 2 - 10} cy={GY - 40} r="3.5" fill={c.bloom} />
                <circle cx={W / 2 + 8} cy={GY - 46} r="3.5" fill={c.bloom} />
                <circle cx={W / 2} cy={GY - 52} r="3.5" fill={c.bloomDeep} />
              </React.Fragment>
            )}
          </g>
        );
      };

      const renderSucculent = () => {
        if (stage === 0) return <ellipse cx={W / 2} cy={GY - 4} rx={6} ry={3} fill={c.leafShadow} />;
        const blade = (cx, cy, rx, ry, rot, fill, key) => (
          <ellipse key={key} cx={cx} cy={cy} rx={rx} ry={ry} fill={fill} transform={`rotate(${rot} ${cx} ${cy})`} />
        );
        const scale = stage === 1 ? 0.55 : stage === 2 ? 0.8 : stage === 3 ? 1 : 1.1;
        const ty = GY - 10 * scale;
        return (
          <g transform={`translate(${W / 2} ${ty}) scale(${scale}) ${wilted ? 'translate(0, 4) skewX(-8)' : ''}`}>
            {blade(0, -8, 5, 18, 0, c.leafDeep, 'b1')}
            {blade(-12, 0, 5, 16, -45, c.leafDeep, 'b2')}
            {blade(12, 0, 5, 16, 45, c.leafDeep, 'b3')}
            {blade(-8, 4, 5, 14, -70, c.leaf, 'b4')}
            {blade(8, 4, 5, 14, 70, c.leaf, 'b5')}
            {stage >= 2 && (
              <React.Fragment>
                {blade(0, -4, 4, 12, 0, c.leafLight, 'f1')}
                {blade(-6, 0, 4, 11, -30, c.leafLight, 'f2')}
                {blade(6, 0, 4, 11, 30, c.leafLight, 'f3')}
              </React.Fragment>
            )}
            {stage >= 3 && <circle cx="0" cy="-2" r="3" fill={c.leafLight} />}
            {stage === 4 && (
              <g transform="translate(0, -22)">
                <circle r="3.5" fill={c.bloomPink} />
                <circle r="1.5" fill={c.bloom} />
              </g>
            )}
          </g>
        );
      };

      const renderFern = () => {
        if (stage === 0) return <ellipse cx={W / 2} cy={GY - 4} rx={5} ry={2.5} fill={c.leafShadow} />;
        const frond = (rot, len, fill, key) => {
          const pts = [];
          for (let i = 1; i <= 7; i++) {
            const t = i / 7;
            const r = (1 - Math.pow(t - 0.5, 2) * 3) * 5;
            pts.push({ t, r });
          }
          return (
            <g key={key} transform={`rotate(${rot} ${W / 2} ${GY}) translate(${W / 2} ${GY})`}>
              <path d={`M0 0 Q ${len * 0.3} ${-len * 0.6}, ${len * 0.1} ${-len}`}
                stroke={fill} strokeWidth="1.5" fill="none" strokeLinecap="round" />
              {pts.map((p, i) => (
                <ellipse key={i}
                  cx={len * 0.3 * (1 - Math.pow(p.t - 0.5, 2) * 2) + (p.t * len * 0.05)}
                  cy={-p.t * len + p.t * len * 0.05}
                  rx={p.r * 0.7} ry={1.6} fill={fill}
                  transform={`rotate(${-30 + p.t * 50} ${len * 0.2} ${-p.t * len})`} />
              ))}
            </g>
          );
        };
        const len = stage === 1 ? 22 : stage === 2 ? 38 : stage === 3 ? 55 : 65;
        const droop = wilted ? 25 : 0;
        return (
          <g transform={wilted ? `translate(0,4)` : ''}>
            {frond(-35 + droop, len, c.leafDeep, 'f1')}
            {frond(35 - droop, len, c.leafDeep, 'f2')}
            {stage >= 2 && frond(-15 + droop * 0.7, len * 1.1, c.leaf, 'f3')}
            {stage >= 2 && frond(15 - droop * 0.7, len * 1.1, c.leaf, 'f4')}
            {stage >= 3 && frond(0, len * 1.15, c.leafLight, 'f5')}
          </g>
        );
      };

      const renderHerb = () => {
        if (stage === 0) return <ellipse cx={W / 2} cy={GY - 4} rx={4} ry={2} fill={c.leafShadow} />;
        if (stage === 1) return (
          <g transform={wilted ? `rotate(-18 ${W / 2} ${GY})` : ''}>
            <path d={`M${W / 2} ${GY} L ${W / 2} ${GY - 14}`} stroke={c.stem} strokeWidth="2" />
            <ellipse cx={W / 2 - 4} cy={GY - 14} rx={5} ry={2.5} fill={c.leaf} transform={`rotate(-30 ${W / 2 - 4} ${GY - 14})`} />
            <ellipse cx={W / 2 + 4} cy={GY - 14} rx={5} ry={2.5} fill={c.leafLight} transform={`rotate(30 ${W / 2 + 4} ${GY - 14})`} />
          </g>
        );
        const stems = [
          { x: -12, h: 0.85, c: c.leafDeep },
          { x: 0, h: 1, c: c.leaf },
          { x: 12, h: 0.9, c: c.leafLight },
        ];
        const baseH = stage === 2 ? 28 : stage === 3 ? 42 : 52;
        return (
          <g transform={wilted ? `translate(0,5)` : ''}>
            {stems.map((s, i) => {
              const h = baseH * s.h;
              const tilt = wilted ? (i - 1) * 18 : (i - 1) * 4;
              return (
                <g key={i} transform={`translate(${W / 2 + s.x} ${GY}) rotate(${tilt})`}>
                  <path d={`M0 0 Q ${i === 0 ? -2 : 2} ${-h * 0.5}, 0 ${-h}`}
                    stroke={s.c} strokeWidth="2" fill="none" strokeLinecap="round" />
                  {[0.35, 0.6, 0.85].map((t, j) => (
                    <g key={j} transform={`translate(0, ${-h * t})`}>
                      <ellipse cx="-5" cy="0" rx="5" ry="2.2" fill={s.c} transform="rotate(-25)" />
                      <ellipse cx="5" cy="0" rx="5" ry="2.2" fill={s.c} transform="rotate(25)" />
                    </g>
                  ))}
                  {stage === 4 && <circle cx="0" cy={-h - 2} r="2.5" fill={c.bloom} />}
                </g>
              );
            })}
          </g>
        );
      };

      const renderers = { lotus: renderLotus, leafy: renderLeafy, succulent: renderSucculent, fern: renderFern, herb: renderHerb };
      const renderer = renderers[species] || renderLeafy;

      return (
        <svg width={size} height={size * (H / W)} viewBox={`0 0 ${W} ${H}`} style={{ overflow: 'visible' }}>
          <SoilPatch cx={W / 2} cy={GY + 1} w={66} />
          {renderer()}
        </svg>
      );
    }

    const STAGE_NAMES = ['Seed', 'Sprout', 'Sapling', 'Bushed', 'In bloom'];
    const SPECIES_LABEL = {
      lotus: 'Moonlit lotus', leafy: 'Wild basil', succulent: 'Desert rose',
      fern: 'Boston fern', herb: 'Field clover',
    };
    const INITIAL_HABITS = [
      { id: 'h1', name: 'Morning meditation', species: 'lotus', stage: 4, streak: 23, wilted: false, doneToday: true, cadence: '10 min · sunrise', note: 'Sit before the day starts.' },
      { id: 'h2', name: 'Read 20 pages', species: 'leafy', stage: 3, streak: 11, wilted: false, doneToday: true, cadence: '20 pages · evening', note: 'Currently: The Overstory.' },
      { id: 'h3', name: 'Drink 2L water', species: 'succulent', stage: 2, streak: 6, wilted: false, doneToday: false, cadence: '2 litres · all day', note: 'Glass on the desk, refill at lunch.' },
      { id: 'h4', name: 'Run 2 miles', species: 'fern', stage: 2, streak: 0, wilted: true, doneToday: false, cadence: '2 mi · before work', note: 'Missed 4 days. A little water will bring it back.' },
      { id: 'h5', name: 'Journal a page', species: 'herb', stage: 1, streak: 2, wilted: false, doneToday: false, cadence: '1 page · before bed', note: 'Plain pen, plain page.' },
      { id: 'h6', name: 'Stretch routine', species: 'fern', stage: 3, streak: 9, wilted: false, doneToday: false, cadence: '8 min · midday', note: 'Hamstrings, hips, shoulders.' },

    const lerp = (a, b, t) => a + (b - a) * t;
    const lerpHex = (h1, h2, t) => {
      const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
      const [r1, g1, b1] = p(h1), [r2, g2, b2] = p(h2);
      const fmt = (n) => Math.round(n).toString(16).padStart(2, '0');
      return `#${fmt(lerp(r1, r2, t))}${fmt(lerp(g1, g2, t))}${fmt(lerp(b1, b2, t))}`;
    };
    const TOD_KEYS = [
      { t: 0, top: '#3b2a3e', mid: '#5a3a4a', bot: '#7a4a48', amberGlow: 0.35, moonOpacity: 0.35, starOpacity: 0.1, bodyColor: '#f6c8a8', glowColor: '255,180,160' },
      { t: 33, top: '#6a96b0', mid: '#9bc0c8', bot: '#c5dcd8', amberGlow: 0.05, moonOpacity: 0, starOpacity: 0, bodyColor: '#fff4c0', glowColor: '255,230,140' },
      { t: 66, top: '#2a1f1a', mid: '#5a3220', bot: '#8a4828', amberGlow: 0.45, moonOpacity: 0.55, starOpacity: 0.12, bodyColor: '#f0b478', glowColor: '240,160,80' },
      { t: 100, top: '#0a1612', mid: '#0e1d18', bot: '#16201a', amberGlow: 0.12, moonOpacity: 1, starOpacity: 0.42, bodyColor: '#f0d9a8', glowColor: '240,217,168' },
    ];
    function todPalette(tod) {
      const v = Math.max(0, Math.min(100, tod));
      let i = 0;
      while (i < TOD_KEYS.length - 1 && v > TOD_KEYS[i + 1].t) i++;
      const a = TOD_KEYS[i], b = TOD_KEYS[Math.min(i + 1, TOD_KEYS.length - 1)];
      const span = b.t - a.t || 1;
      const t = (v - a.t) / span;
      return {
        top: lerpHex(a.top, b.top, t),
        mid: lerpHex(a.mid, b.mid, t),
        bot: lerpHex(a.bot, b.bot, t),
        amberGlow: lerp(a.amberGlow, b.amberGlow, t),
        moonOpacity: lerp(a.moonOpacity, b.moonOpacity, t),
        starOpacity: lerp(a.starOpacity, b.starOpacity, t),
        bodyColor: lerpHex(a.bodyColor, b.bodyColor, t),
        glowColor: a.glowColor,
        isDaytime: v > 20 && v < 55,
      };
    }
    function moodOverlay(mood) {
      if (mood < 50) {
        const k = (50 - mood) / 50;
        return { tint: `rgba(80, 130, 180, ${k * 0.14})`, saturate: 1 + k * 0.05 };
      }
      const k = (mood - 50) / 50;
      return { tint: `rgba(210, 90, 40, ${k * 0.18})`, saturate: 1 - k * 0.25 };
    }
    function genSlots(n) {
      n = Math.max(1, Math.min(8, n));
      const back = n <= 2 ? 0 : Math.ceil((n - 2) / 2);
      const front = n - back;
      const slots = [];
      for (let i = 0; i < back; i++) {
        const x = back === 1 ? 50 : 16 + (i / (back - 1)) * 68;
        const wobble = (i % 2) * 10;
        slots.push({ l: `${x}%`, b: 246 + wobble, s: 54 + (i % 3) * 2, z: 2 });
      }
      for (let i = 0; i < front; i++) {
        const x = front === 1 ? 50 : 22 + (i / (front - 1)) * 56;
        const stagger = (i % 2) * 12;
        slots.push({ l: `${x}%`, b: 158 + stagger, s: 108 + (i % 2) * 10, z: 5 + i });
      }
      return slots;
    }

    function hashSeed(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return h;
    }
    function genHistory(habit, days = 28) {
      const arr = [];
      const seed = hashSeed(habit.id);
      for (let i = 0; i < days; i++) {
        const remaining = days - 1 - i;
        let kept;
        if (habit.wilted) {
          kept = remaining < 4 ? false : ((Math.sin(seed + i * 1.7) + 1) / 2) > 0.32;
        } else if (remaining < habit.streak) {
          kept = true;
        } else {
          const r = (Math.sin(seed + i * 0.9) + 1) / 2;
          kept = r > 0.35;
        }
        arr.push(kept ? 1 : 0);
      }
      return arr;
    }

    function GrowthLine({ history, species }) {
      const W = 320, H = 56;
      const days = history.length;
      const stepX = W / (days - 1);
      let rolling = 0.15;
      const values = history.map((h) => {
        if (h) rolling = Math.min(rolling + 0.12, 1);
        else rolling = Math.max(rolling - 0.18, 0.08);
        return rolling;
      });
      const baseline = H / 2 + 2;
      const top = values.map((v, i) => [i * stepX, baseline - v * 20]);
      const bot = values.map((v, i) => [i * stepX, baseline + v * 8]);
      const path = [
        `M ${top[0][0].toFixed(1)} ${top[0][1].toFixed(1)}`,
        ...top.slice(1).map(([x, y]) => `L ${x.toFixed(1)} ${y.toFixed(1)}`),
        ...[...bot].reverse().map(([x, y]) => `L ${x.toFixed(1)} ${y.toFixed(1)}`),
        'Z',
      ].join(' ');
      return (
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none"
          style={{ display: 'block' }}>
          <defs>
            <linearGradient id={`gl-${species}`} x1="0" x2="1" y1="0" y2="0">
              <stop offset="0%" stopColor="#3d6647" stopOpacity="0.4" />
              <stop offset="60%" stopColor="#7eb586" stopOpacity="0.85" />
              <stop offset="100%" stopColor="#a8d39e" stopOpacity="1" />
            </linearGradient>
          </defs>
          <path d={path} fill={`url(#gl-${species})`} />
          {history.map((h, i) => (
            <circle key={i} cx={i * stepX} cy={baseline}
              r={h ? 1.8 : 1}
              fill={h ? '#f0e8d5' : '#5e5230'}
              opacity={h ? 0.7 : 0.5} />
          ))}
          <line x1="0" x2={W} y1={H - 4} y2={H - 4} stroke="#2a1f15" strokeWidth="1" opacity="0.6" />
        </svg>
      );
    }

    function streakStats(hist) {
      let best = 0, cur = 0, gap = 0, longestGap = 0;
      hist.forEach((h) => {
        if (h) { cur++; gap = 0; best = Math.max(best, cur); }
        else { gap++; cur = 0; longestGap = Math.max(longestGap, gap); }
      });
      return { best, longestGap };
    }

                      });
                      const baseline = H / 2 + 8;
                      const top = vals.map((v, i) => [i * stepX, baseline - v * 36]);
                      const bot = vals.map((v, i) => [i * stepX, baseline + v * 14]);
                      const path = [
                        `M ${top[0][0].toFixed(1)} ${top[0][1].toFixed(1)}`,
                        ...top.slice(1).map(([x, y]) => `L ${x.toFixed(1)} ${y.toFixed(1)}`),
                        ...[...bot].reverse().map(([x, y]) => `L ${x.toFixed(1)} ${y.toFixed(1)}`),
                        'Z',
                      ].join(' ');
                      return (
                        <g>
                          <path d={path} fill={`url(#gle-${h.id})`} />
                          {hist.map((d, i) => (
                            <circle key={i} cx={i * stepX} cy={baseline}
                              r={d ? 2.2 : 1.4}
                              fill={d ? '#f0e8d5' : '#5e5230'}
                              opacity={d ? 0.8 : 0.6} />
                          ))}
                          <line x1="0" x2={W} y1={H - 4} y2={H - 4} stroke="#2a1f15" strokeWidth="1" opacity="0.5" />
                        </g>
                      );
                    })()}
                  </svg>
                </div>

    function HabitGarden() {
      const [habits, setHabits] = useState(INITIAL_HABITS);
      const [selectedId, setSelectedId] = useState(null);
      const [showAdd, setShowAdd] = useState(false);
      const [tab, setTab] = useState('garden');
      const [wateringId, setWateringId] = useState(null);
      const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
      const [editMode, setEditMode] = useState(false);

      useEffect(() => {
        const onMsg = (e) => {
          const d = e.data || {};
          if (d.type === '__activate_edit_mode') setEditMode(true);
          else if (d.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', onMsg);
        try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch (_) { }
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const setTweak = (k, v) => {
        setTweaks((t) => {
          const next = { ...t, [k]: v };
          try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*'); } catch (_) { }
          return next;
        });
      };
      const closePanel = () => {
        setEditMode(false);
        try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch (_) { }
      };

      const selected = habits.find((h) => h.id === selectedId);

      const water = () => {
        if (!selected) return;
        setWateringId(selected.id);
        setTimeout(() => setWateringId(null), 1100);
        setHabits((hs) => hs.map((h) =>
          h.id === selected.id
            ? { ...h, stage: Math.min(4, h.stage + 1), streak: h.streak + 1, doneToday: true, wilted: false }
            : h));
      };
      const revive = () => {
        if (!selected) return;
        setWateringId(selected.id);
        setTimeout(() => setWateringId(null), 1100);
        setHabits((hs) => hs.map((h) =>
          h.id === selected.id
            ? { ...h, wilted: false, stage: 1, streak: 1, doneToday: true }
            : h));
      };
      const addHabit = ({ name, species, cadence }) => {
        const id = 'h' + Date.now();
        setHabits((hs) => [...hs, {
          id, name, species, cadence, stage: 0, streak: 0,
          wilted: false, doneToday: false, note: 'Freshly planted. Water tomorrow.',
        }]);
        setShowAdd(false);
        setSelectedId(id);
      };

      const visibleHabits = habits.slice(0, tweaks.plantDensity);
      const slots = useMemo(() => genSlots(tweaks.plantDensity), [tweaks.plantDensity]);
      const mood = moodOverlay(tweaks.gardenMood);
      const tod = todPalette(tweaks.timeOfDay);

      const openHabit = (id) => setSelectedId(id);

      return (
        <div style={{
          position: 'relative', width: '100%', height: '100%',

                    </div>

              style={{
                position: 'absolute', top: 142, right: 22, zIndex: 250,
                width: 38, height: 38, borderRadius: '50%',
                background: editMode
                  ? `linear-gradient(135deg, ${P.amberWarm}, ${P.amber})`
                  : 'rgba(14, 24, 19, 0.88)',
                border: `1px solid ${editMode ? 'rgba(232,184,122,0.8)' : 'rgba(212,162,94,0.35)'}`,
                cursor: 'pointer',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: editMode
                  ? '0 4px 16px rgba(232,184,122,0.45), 0 0 0 4px rgba(232,184,122,0.12)'
                  : '0 4px 14px rgba(0,0,0,0.45)',
                transition: 'all 200ms ease',
                padding: 0,
              }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M12 3 a 9 9 0 1 0 0 18 c 1.4 0 2.4 -0.9 2.4 -2.2 c 0 -0.6 -0.2 -1 -0.2 -1.5 c 0 -0.9 0.7 -1.4 1.6 -1.4 H 17.5 a 3.2 3.2 0 0 0 3.2 -3.2 C 20.7 7.2 16.8 3 12 3z"
                  stroke={editMode ? '#0e1d18' : P.cream} strokeWidth="1.5" strokeLinejoin="round" fill="none" />
                <circle cx="7.6" cy="10.2" r="1.2" fill={editMode ? '#0e1d18' : '#e8b87a'} />
                <circle cx="11" cy="7.2" r="1.2" fill={editMode ? '#0e1d18' : '#a8d39e'} />
                <circle cx="15" cy="9.6" r="1.2" fill={editMode ? '#0e1d18' : '#7fb6d4'} />
              </svg>
            </button>
          )}

          {selected && (
            <DetailSheet habit={selected} onClose={() => setSelectedId(null)} onWater={water} onRevive={revive} />
          )}
          {showAdd && (
            <AddSheet onClose={() => setShowAdd(false)} onAdd={addHabit} />
          )}
          {editMode && tab === 'garden' && (
            <TweaksPanel tweaks={tweaks} setTweak={setTweak} onClose={closePanel} />
          )}
        </div>
      );
    }

    function Shell() {
      const calcScale = () => Math.min(
        (window.innerWidth - 40) / 402,
        (window.innerHeight - 60) / 874,
        1
      );
      const [scale, setScale] = useState(calcScale);
      useEffect(() => {
        const onResize = () => setScale(calcScale());
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);
      return (
        <div style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
          <IOSDevice width={402} height={874}>
            <HabitGarden />
          </IOSDevice>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Shell />);
  </script>
</body>

</html>
